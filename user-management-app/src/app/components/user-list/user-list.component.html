<div class="container-fluid py-4">
  <!-- Header -->
  <div class="row mb-4">
    <div class="col-md-6">
      <h2>User Management</h2>
    </div>
    <div class="col-md-6 text-end">
      <button class="btn btn-outline-danger me-2" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
      <button class="btn btn-primary" (click)="openCreateModal()">
        <i class="bi bi-plus-circle"></i> Add User
      </button>
    </div>
  </div>

  <!-- Error Alert -->
  <div class="alert alert-danger alert-dismissible fade show" *ngIf="errorMessage">
    {{ errorMessage }}
    <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
  </div>

  <!-- Loading Spinner -->
  <div class="text-center py-5" *ngIf="isLoading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Users Table -->
  <div class="card shadow-sm" *ngIf="!isLoading">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-2" (click)="openEditModal(user)">
                <i class="bi bi-pencil"></i> Edit
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteUser(user)">
                <i class="bi bi-trash"></i> Delete
              </button>
            </td>
          </tr>
          </tbody>
        </table>

        <div class="text-center py-4" *ngIf="users.length === 0">
          <p class="text-muted">No users found.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Add/Edit User -->
<div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ isEditing ? 'Edit User' : 'Add New User' }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <form (ngSubmit)="saveUser()" #userForm="ngForm">
        <div class="modal-body">
          <div class="mb-3">
            <label for="userName" class="form-label">Name</label>
            <input
              type="text"
              class="form-control"
              id="userName"
              name="userName"
              [(ngModel)]="newUser.name"
              required
              #userName="ngModel"
              [class.is-invalid]="userName.invalid && userName.touched"
            >
            <div class="invalid-feedback">
              Name is required
            </div>
          </div>

          <div class="mb-3">
            <label for="userEmail" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="userEmail"
              name="userEmail"
              [(ngModel)]="newUser.email"
              required
              email
              #userEmail="ngModel"
              [class.is-invalid]="userEmail.invalid && userEmail.touched"
            >
            <div class="invalid-feedback">
              <span *ngIf="userEmail.errors?.['required']">Email is required</span>
              <span *ngIf="userEmail.errors?.['email']">Please enter a valid email</span>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="userForm.invalid"
          >
            {{ isEditing ? 'Update' : 'Create' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade" [class.show]="showModal" *ngIf="showModal"></div>
